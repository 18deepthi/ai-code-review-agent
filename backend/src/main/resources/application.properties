spring.application.name=ai-code-reviewer-backend
server.port=${PORT:8080}

# Logging
logging.level.com.reviewer=DEBUG
logging.level.org.springframework.web=INFO

# Groq API Configuration
app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
app.groq.fallback-model=${GROQ_FALLBACK_MODEL:qwen/qwen3.8-27b}
app.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.groq.max-retries=1
app.groq.timeout-ms=12000

# Hindsight Cloud API Configuration
app.hindsight.api-key=${HINDSIGHT_API_KEY:}
app.hindsight.base-url=${HINDSIGHT_BASE_URL:https://api.hindsight.vectorize.io}
app.hindsight.timeout-ms=15000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
